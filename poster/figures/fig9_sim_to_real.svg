   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="11.338583" y="32.755062" transform="rotate(-0 11.338583 32.755062)">Seen on the real drone</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="742.677165" y="32.755062" transform="rotate(-0 742.677165 32.755062)">Fix</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 103.521983)">Motors chattered between 0 and 100 %:</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 124.851983)">real gyro noise is 35× the paper’s</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 103.610108)">Train with the measured noise and</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 124.763858)">penalise angular acceleration</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="113.270108" transform="rotate(-0 1390.393701 113.270108)">Sim</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 208.609186)">Policies collapsed when the position</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 229.762936)">estimate arrived &gt; 5 ms late</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 208.491998)">Randomise a 0–12 ms estimate</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 229.645748)">delay during training</text>
   </g>
   <g id="text_8">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="218.151998" transform="rotate(-0 1390.393701 218.151998)">Sim</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 313.221075)">Lighthouse drop-outs make the position</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 334.68045)">jump by 10–37 cm</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 313.2567)">Inject random position jumps</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 334.644825)">during training</text>
   </g>
   <g id="text_11">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="323.033888" transform="rotate(-0 1390.393701 323.033888)">Sim</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="11.338583" y="428.954528" transform="rotate(-0 11.338583 428.954528)">Policy held a steady position offset</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 418.220153)">Feed a position-error integral</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 439.679528)">as 3 extra inputs</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="410.907904" transform="rotate(-0 1390.393701 410.907904)">Sim</text>
   </g>
   <g id="text_15">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="444.923652" transform="rotate(-0 1390.393701 444.923652)">Firmware</text>
   </g>
   <g id="text_16">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 522.996105)">No PID: the policy must take off</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 544.67673)">and land by itself</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 523.259542)">Simulate floor contact and ground</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 544.647667)">effect; curriculum of missions</text>
   </g>
   <g id="text_18">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="532.797667" transform="rotate(-0 1390.393701 532.797667)">Sim</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 627.983932)">Radio task starved with the</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 649.208932)">policy at 500 Hz</text>
   </g>
   <g id="text_20">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 627.96112)">Run the policy at 100 Hz,</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 649.525495)">the simulator’s step</text>
   </g>
   <g id="text_21">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="637.679557" transform="rotate(-0 1390.393701 637.679557)">Firmware</text>
   </g>
   <g id="text_22">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 732.759884)">Two motors stopped in flight</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #0b0b0b" transform="translate(11.338583 754.440509)">(shared DMA in the DShot driver)</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 732.865822)">Write all four motor commands</text>
    <text style="font-size: 20px; font-family: 'Arial'; fill: #52514e" transform="translate(742.677165 754.090822)">every 1 kHz tick</text>
   </g>
   <g id="text_24">
    <text style="font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1390.393701" y="742.561447" transform="rotate(-0 1390.393701 742.561447)">Firmware</text>
   </g>
  </g>
 </g>
