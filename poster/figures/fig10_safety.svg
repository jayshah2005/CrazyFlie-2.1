   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="977.952756" y="410.363856" transform="rotate(-0 977.952756 410.363856)">Automatic landing</text>
   </g>
   <g id="text_8">
