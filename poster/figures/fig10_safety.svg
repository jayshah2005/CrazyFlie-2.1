   </g>
   <g id="text_11">
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(537.07173 360.464173)">In the air, if any of:</text>
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(558.901886 384.424845)">• Enter released</text>
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(464.940011 408.472141)">• battery &lt; 3.45 V for 0.5 s</text>
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(498.234855 432.765532)">• no telemetry for 0.5 s</text>
   </g>
   <g id="text_12">
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(1238.740157 292.33669)">near the</text>
    <text style="font-size: 21px; font-family: 'Arial'; fill: #52514e" transform="translate(1238.740157 313.796557)">floor</text>
   </g>
