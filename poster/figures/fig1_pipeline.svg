   <g id="text_1">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="175.748031" y="183.465431" transform="rotate(-0 175.748031 183.465431)">1  Measure</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(89.561313 218.88892)">Fly the stock PID,</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(91.374594 243.990576)">log motor speeds</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="547.653543" y="169.165431" transform="rotate(-0 547.653543 169.165431)">2  Model</text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(448.626043 204.58892)">Brushless simulator:</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(484.69745 229.432764)">mass, thrust,</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(501.804168 254.276607)">motor lag</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="919.559055" y="169.165431" transform="rotate(-0 919.559055 169.165431)">3  Train</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(848.031555 204.58892)">Reinforcement</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(846.206243 229.781326)">learning (TD3),</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(849.86718 254.967889)">2 million steps</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1291.464567" y="169.165431" transform="rotate(-0 1291.464567 169.165431)">4  Select</text>
   </g>
   <g id="text_8">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1205.870817 204.857045)">Score every 100k</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1218.089411 229.958701)">checkpoint in a</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1204.048942 254.802545)">simulated mission</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="1663.370079" y="169.165431" transform="rotate(-0 1663.370079 169.165431)">5  Deploy</text>
   </g>
   <g id="text_10">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1563.108516 204.857045)">Compile the network</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1579.01211 229.700889)">into the firmware,</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1590.60336 254.544732)">flash the drone</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial'; text-anchor: middle; fill: #0b0b0b" x="2035.275591" y="183.542618" transform="rotate(-0 2035.275591 183.542618)">6  Fly</text>
   </g>
   <g id="text_12">
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1938.059653 218.88892)">Policy runs onboard</text>
    <text style="font-size: 22px; font-family: 'Arial'; fill: #52514e" transform="translate(1948.456372 243.990576)">at 100 Hz, no PID</text>
   </g>
   <g id="text_13">
    <text style="font-size: 22px; font-family: 'Arial'; text-anchor: middle; fill: #52514e" x="1291.464567" y="458.220037" transform="rotate(-0 1291.464567 458.220037)">Real flights reveal sim-to-real gaps  →  improve the simulator and retrain</text>
   </g>
   <g id="text_14">
    <text style="font-size: 21px; font-family: 'Arial'; text-anchor: start; fill: #52514e" x="68.031496" y="33.775285" transform="rotate(-0 68.031496 33.775285)">In simulation</text>
   </g>
   <g id="text_15">
    <text style="font-size: 21px; font-family: 'Arial'; text-anchor: start; fill: #52514e" x="470.551181" y="33.775285" transform="rotate(-0 470.551181 33.775285)">On the real drone</text>
   </g>
  </g>
